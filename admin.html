<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>অ্যাডমিন প্যানেল – ওয়েবসাইট ম্যানেজার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0E5A3E;--green2:#17805A;--mint:#EAF8EF;--amber:#FFB400;--amber2:#FF8A00;--cream:#FFF7E3;--ink:#2A1C10;--mut:#7a6a55;--line:#eadfc2;--red:#d4291f;--card:#fff;--r:14px;--sh:0 4px 14px rgba(60,35,5,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0,#fff,var(--cream) 70%)}
.login-card{width:100%;max-width:400px;background:#fff;border:2px solid #e3a62a;border-radius:20px;padding:28px 24px;box-shadow:0 14px 40px rgba(60,35,5,.15);text-align:center}
.login-card .logo{font-size:44px;line-height:1}
.login-card h1{font-size:1.4rem;margin:8px 0 2px;color:var(--green)}
.login-card p{color:var(--mut);font-size:.9rem;margin-bottom:16px}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid #ddd0ad;border-radius:12px;font-size:1rem;margin-bottom:12px;background:#fffefa}
.login-card input:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px rgba(23,128,90,.2)}
.err-box{background:#fdf2e9;border:1.5px solid #f5b796;color:#9c2a0c;border-radius:10px;padding:9px 12px;font-size:.88rem;margin-bottom:12px;text-align:left}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;font-size:.92rem;background:#efe6d2;color:var(--ink);transition:transform .1s,background .15s}
.btn:hover{background:#e6d9b8}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#17a06e,var(--green));color:#fff;box-shadow:0 3px 0 #0a3f2b}
.btn.pri:hover{background:linear-gradient(180deg,#1bb07a,var(--green2))}
.btn.amb{background:linear-gradient(180deg,#FFC93C,var(--amber2));color:#2b1a0c;box-shadow:0 3px 0 #b25e00}
.btn.ghost{background:#fff;border:1.5px dashed #cdbb8a;color:var(--green)}
.btn.ghost:hover{background:var(--mint)}
.btn.danger{background:#fee2e2;color:#991b1b}
.btn.block{width:100%;padding:12px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.ib{width:32px;height:32px;border:0;border-radius:8px;background:#f4ecd8;font-size:.95rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{background:#e9dcb8}
.ib:disabled{opacity:.35;cursor:default}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.top-in{max-width:960px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-weight:400;opacity:.85;font-size:.78rem;display:block;line-height:1.1}
.top .btn{padding:8px 12px;font-size:.85rem}
.top .btn.save{background:linear-gradient(180deg,#FFC93C,var(--amber2));color:#2b1a0c;box-shadow:0 3px 0 #b25e00;font-weight:700}
.top .btn.save.dirty{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{scale:1.06}}
.top .btn.lite{background:rgba(255,255,255,.18);color:#fff}
.top .btn.lite:hover{background:rgba(255,255,255,.3)}


.tabs-in{max-width:960px;margin:auto;display:flex;gap:4px;padding:6px 10px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:10px;font-weight:600;color:var(--mut);white-space:nowrap;font-size:.95rem}
.tab:hover{background:var(--cream)}
.tab.on{background:var(--mint);color:var(--green)}

.wrap{max-width:960px;margin:auto;padding:16px 12px 90px}
.hint{background:#fff8e1;border:1.5px solid #f3dc8c;border-radius:12px;padding:10px 14px;font-size:.88rem;color:#6b5420;margin-bottom:14px}
.hint b{color:#4d3a10}

/* ---------- section cards ---------- */
.sec{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:10px;box-shadow:var(--sh);overflow:hidden;transition:opacity .2s}
.sec.off{opacity:.62;background:#faf6ea}
.sec-h{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.sec-ic{width:38px;height:38px;border-radius:11px;background:var(--mint);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
.sec.off .sec-ic{background:#eee}
.sec-t{flex:1;min-width:0}
.sec-t b{display:block;font-size:1rem;line-height:1.25}
.sec-t span{display:block;font-size:.8rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-act{display:flex;align-items:center;gap:6px;flex:none}
.chev{transition:transform .2s;color:var(--mut);font-size:.8rem}
.sec.open .chev{transform:rotate(180deg)}
.sec-b{display:none;padding:4px 14px 16px;border-top:1px dashed var(--line);background:#fffdf8}
.sec.open .sec-b{display:block}
.badge{font-size:.72rem;background:var(--mint);color:var(--green);padding:2px 8px;border-radius:20px;font-weight:600}

/* ---------- switch ---------- */
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw-t{width:44px;height:25px;border-radius:25px;background:#cfc6b0;position:relative;transition:background .2s;flex:none}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+.sw-t{background:var(--green2)}
.sw input:checked+.sw-t::after{transform:translateX(19px)}
.sw input:focus-visible+.sw-t{outline:3px solid #1a73e8;outline-offset:2px}
.sw-l{font-size:.85rem;font-weight:600}

/* ---------- fields ---------- */
.fld{margin-top:12px}
.fld label{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;border:1.5px solid #ddd0ad;border-radius:10px;padding:9px 12px;background:#fff;font-size:.95rem}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px rgba(23,128,90,.18)}
.fld small{display:block;color:var(--mut);font-size:.78rem;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.sub-h{font-weight:700;color:var(--green);margin:18px 0 0;font-size:.95rem;display:flex;align-items:center;gap:6px}
.sub-h::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--amber),var(--amber2))}

/* ---------- lists ---------- */
.list{display:grid;gap:8px;margin-top:6px}
.li{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px}
.li .th{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#eee;flex:none;border:1px solid var(--line)}
.li .th.bad{opacity:.25}
.li input,.li textarea{flex:1;min-width:0;border:1.5px solid #ddd0ad;border-radius:8px;padding:8px 10px;background:#fffefa;font-size:.9rem}
.li input:focus,.li textarea:focus{outline:0;border-color:var(--green)}
.li-b{display:flex;gap:4px;flex:none}
@media(max-width:560px){.li{flex-wrap:wrap}.li input,.li textarea{flex:1 1 100%;order:3}.li-b{margin-left:auto}}
.prod{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.prod.off{opacity:.6;background:#faf6ea}
.prod-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.prod-h .th{width:54px;height:54px;border-radius:10px;object-fit:cover;background:#eee;border:1px solid var(--line);flex:none}
.prod-h .th.bad{opacity:.25}
.prod-h b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-h code{font-size:.72rem;color:var(--mut);background:#f4ecd8;padding:1px 6px;border-radius:6px}
.mt{margin-top:14px}

/* ---------- orders ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.35rem;color:var(--green);line-height:1.2}
.stat span{font-size:.78rem;color:var(--mut)}
.ord{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.ord-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.ord-h b{font-size:1rem}
.ord-h small{color:var(--mut)}
.ord-b{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px;font-size:.88rem}
@media(max-width:560px){.ord-b{grid-template-columns:1fr}}
.ord-b div span{color:var(--mut);font-size:.76rem;display:block}
.ord-b .full{grid-column:1/-1}
.ord-b pre{font-family:inherit;white-space:pre-wrap;word-break:break-word}
.ord-t{font-weight:700;color:var(--green)}
.st{border:0;border-radius:20px;padding:5px 10px;font-weight:700;font-size:.82rem}
.st.New{background:#FEF3C7;color:#92400E}.st.Processing{background:#DBEAFE;color:#1E40AF}.st.Delivered{background:#D1FAE5;color:#065F46}.st.Cancelled{background:#FEE2E2;color:#991B1B}
.empty{text-align:center;color:var(--mut);padding:30px 10px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.cards{grid-template-columns:1fr}}
.cbox{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.cbox h3{font-size:1rem;color:var(--green);margin-bottom:4px}
.cbox p{font-size:.85rem;color:var(--mut);margin-bottom:10px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1e293b;color:#fff;padding:11px 18px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{background:#0f5132}.toast.bad{background:#9c2a0c}
.spinner{display:inline-block;width:14px;height:14px;border:2.5px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:999px){}
.colr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.colr label{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.88rem;font-weight:600}
.colr input[type=color]{width:42px;height:34px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.colr span small{display:block;font-weight:400;color:var(--mut);font-size:.74rem}
.ib.pick{width:auto;padding:0 9px;font-size:.78rem;font-weight:600;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== নতুন লেআউট: ডানদিকে সাইডবার ===== */
.shell{display:flex;align-items:flex-start;min-height:100vh}
.col{flex:1;min-width:0;order:1}
.pv{width:400px;flex:none;position:sticky;top:0;height:100vh;order:2;background:#fff;border-left:2px solid var(--line);display:flex;flex-direction:column}
.pv-h{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--green);color:#fff}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.side{width:268px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-left:1px solid var(--line);padding:14px 10px 50px;order:3}
.side-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:1.05rem;color:var(--green);padding:2px 6px 10px}
.side-grp{font-size:.74rem;font-weight:700;color:var(--mut);letter-spacing:.3px;padding:14px 8px 6px}
.si{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:8px 9px;border-radius:10px;text-align:left;font-size:.92rem;font-weight:600;color:var(--ink)}
.si:hover{background:var(--cream)}
.si.on{background:var(--mint);color:var(--green)}
.si .ic{width:26px;text-align:center;font-size:1.05rem;flex:none}
.si .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si .dot{width:9px;height:9px;border-radius:50%;background:#22a06b;flex:none}
.si .dot.off{background:#c9c0ac}
.si.add{color:var(--green);border:1.5px dashed #cdbb8a;margin:8px 0 2px;justify-content:center}
.scrim{display:none}
#menuBtn{display:none}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.ph .sec-ic{flex:none}
.ph h2{font-size:1.15rem;line-height:1.3}
.ph p{font-size:.82rem;color:var(--mut)}
.ph .grow{flex:1;min-width:140px}
.pg{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:4px 16px 18px;box-shadow:var(--sh)}
.pg.off{opacity:.65}
.fld select{background:#fff}
.cardbox{background:#fffdf8;border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.cardbox .li-b{margin-top:6px}
.cardrow{display:flex;gap:8px;align-items:center}
.preset{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-weight:600;font-size:.85rem;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pbtn:hover{border-color:var(--green)}
.sw-strip{display:flex;height:16px;width:110px;border-radius:6px;overflow:hidden}
.sw-strip i{flex:1}
.tpl{width:100%;min-height:90px;font-family:Consolas,monospace;font-size:.78rem;border:1.5px solid #ddd0ad;border-radius:10px;padding:8px;background:#fffefa}
ol.steps{padding-left:20px;line-height:1.9;font-size:.93rem}
code{background:#f4ecd8;padding:1px 6px;border-radius:6px;font-size:.85em}
.ord-row{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.ord-row.off{opacity:.6}
.ord-row .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
@media(max-width:999px){
  .pv{display:none!important}
  .side{position:fixed;right:0;top:0;bottom:0;z-index:70;transform:translateX(105%);transition:transform .25s;box-shadow:-10px 0 30px rgba(0,0,0,.25);width:min(86vw,300px)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:65}
  #menuBtn{display:inline-flex}
}
</style>
</head>
<body>

<div class="login" id="loginView">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="logo">🍯</div>
    <h1>অ্যাডমিন প্যানেল</h1>
    <p>ওয়েবসাইটের কনটেন্ট, দাম, রং ও ছবি এখান থেকে নিয়ন্ত্রণ করুন</p>
    <div class="err-box" id="loginErr" hidden></div>
    <input type="text" name="username" value="admin" autocomplete="username" hidden aria-hidden="true" tabindex="-1">
    <input type="password" id="pw" name="password" placeholder="পাসওয়ার্ড দিন" autocomplete="current-password" required>
    <button class="btn pri block" id="loginBtn" type="submit">লগইন করুন</button>
  </form>
</div>

<div class="shell" id="appView" hidden>
  <div class="col">
    <div class="top"><div class="top-in">
      <div class="brand">🍯 <span>অ্যাডমিন প্যানেল<small id="dirtyTxt">কোনো পরিবর্তন নেই</small></span></div>
      <button class="btn lite" id="previewBtn" type="button">👁 লাইভ প্রিভিউ</button>
      <button class="btn save" id="saveBtn" type="button">⬇️ আপডেট ডাউনলোড</button>
      <button class="btn lite" id="menuBtn" type="button" aria-label="মেনু">☰ মেনু</button>
    </div></div>
    <main class="wrap" id="main"></main>
  </div>
  <aside class="pv" id="pv" hidden><div class="pv-h"><b>👁 লাইভ প্রিভিউ</b><button class="ib" id="pvClose" type="button">✕</button></div><iframe id="pvFrame" title="Preview"></iframe></aside>
  <aside class="side" id="side" aria-label="মেনু"></aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script>
(function () {
  "use strict";
  var DEF = window.SITE_CONFIG || {};
  var CODE_TPL = "/**\n * =========================================================================\n * খাঁটি মধু ও প্রিমিয়াম হানি নাট – অর্ডার ব্যাকএন্ড (Google Apps Script)\n * কাজ: অর্ডার, ভিজিটর অ্যাক্টিভিটি ও Pixel ইভেন্ট গুগল শিটে সংরক্ষণ (Orders, User Activity, Pixel Events, Report, Dashboard)\n * ওয়েবসাইটের কনটেন্ট/দাম পরিবর্তনের জন্য এখানে কিছু করতে হয় না – সেটা admin.html থেকে হয়।\n * =========================================================================\n *\n * 🚀 সেটআপ (একবারই):\n *    ১. গুগল শিট খুলুন ➔ Extensions ➔ Apps Script\n *    ২. পুরো কোড মুছে এই ফাইলের সব কোড পেস্ট করুন\n *    ৩. নিচে SPREADSHEET_ID ও SITE_URL ঠিক আছে কিনা দেখে Save (💾) করুন\n *    ৪. ড্রপডাউন থেকে \"setupAll\" সিলেক্ট করে ▶ Run চাপুন (Permission দিন)\n *    ৫. Deploy ➔ Manage deployments ➔ ✏️ ➔ Version: New version ➔ Deploy\n *       (নতুন করে করলে: New deployment ➔ Web app ➔ Execute as: Me ➔ Access: Anyone,\n *        তারপর /exec লিংক js/config.js এর apiEndpoint এ বসান)\n * =========================================================================\n */\n\n\n/* =========================================================================\n   ১. সেটিংস (শুধু এই অংশ এডিট করুন)\n   ========================================================================= */\n\n// আপনার গুগল শিটের লিংক অথবা আইডি (admin.html এর \"Google Sheet ও API\" পেজ থেকে Code.gs তৈরি করলে এটি নিজেই বসে যায়)\n// খালি রাখলে: যে শিট থেকে Extensions → Apps Script খুলেছেন সেটিই ব্যবহার হবে\nvar SPREADSHEET_ID = \"\";\n\n// 🌐 আপনার Vercel ওয়েবসাইটের লিংক (যেমন: https://my-honey.vercel.app)\n//    এটি দিলে অর্ডারের দাম সবসময় ওয়েবসাইটের js/config.js থেকে যাচাই হয়, তাই\n//    admin.html এ দাম বদলালে এখানে আলাদা করে কিছু বদলাতে হয় না।\n//    খালি রাখলে নিচের ডিফল্ট দাম (PRODUCTS_CONFIG) ব্যবহার হবে।\nvar SITE_URL = \"\";\n\n// অর্ডার জমা হওয়ার ট্যাবের নাম\nvar SHEET_NAME = \"Orders\";\n\n// টাকার প্রতীক ও টাইমজোন\nvar CURRENCY = \"৳\";\nvar TIMEZONE = \"Asia/Dhaka\";\n\n// ফ্রড/স্প্যাম প্রটেকশন: একই নাম্বার থেকে কত মিনিট পর আবার অর্ডার করা যাবে\nvar FRAUD_PROTECTION = { enabled: true, cooldownMinutes: 2 };   // একই নাম্বারে ২ মিনিটের মধ্যে আবার অর্ডার করলে ফ্রড এলার্ট\n\n// ভিজিটর ট্র্যাকিং: প্রতি মিনিটে সর্বোচ্চ কতটি ট্র্যাকিং রিকোয়েস্ট নেওয়া হবে (অর্ডারকে অগ্রাধিকার দিতে)\nvar TRACK_LIMIT_PER_MIN = 90;\n\n\n/* =========================================================================\n   ২. ডিফল্ট পণ্য ও ডেলিভারি (SITE_URL খালি থাকলে এগুলোই ব্যবহার হবে)\n   ========================================================================= */\nvar PRODUCTS_CONFIG = {\n  \"m500\":   { name: \"খাঁটি মধু – ৫০০ গ্রাম\",                         price: 550 },\n  \"m1000\":  { name: \"খাঁটি মধু – ১ কেজি\",                            price: 1050 },\n  \"hn500\":  { name: \"প্রিমিয়াম হানি নাট – ৫০০ গ্রাম\",                 price: 650 },\n  \"hn1000\": { name: \"প্রিমিয়াম হানি নাট – ১ কেজি\",                    price: 1250 },\n  \"combo\":  { name: \"মেগা কম্বো (১ কেজি মধু + ১ কেজি হানি নাট)\",      price: 2200 }\n};\nvar SHIPPING_CONFIG = {\n  \"dhaka\":   { label: \"ঢাকার ভিতরে\",  charge: 60 },\n  \"outside\": { label: \"ঢাকার বাইরে\", charge: 120 }\n};\nvar FREE_SHIPPING_MIN_TOTAL = 0;\nvar MAX_QTY_PER_ITEM = 20;\n\n\n/* =========================================================================\n   ৩. শিটের কলাম ও স্ট্যাটাস\n   ========================================================================= */\nvar HEADERS = [\n  \"Order ID\", \"Date & Time\", \"Customer Name\", \"Phone Number\", \"District / Area\",\n  \"Full Address\", \"Ordered Products\", \"Total Items (Qty)\", \"Products Subtotal\",\n  \"Delivery Method\", \"Delivery Charge\", \"Grand Total Bill\", \"Customer Note\", \"Order Status\", \"Traffic Source\"\n];\nvar COL_WIDTHS = [140, 165, 170, 130, 125, 250, 280, 100, 130, 125, 120, 140, 190, 120, 160];\nvar STATUS_COL = 14;                  // Order Status কলামের নম্বর (N)\nvar STATUSES = [\"New\", \"Processing\", \"Delivered\", \"Cancelled\"];\nvar FORMAT_ROWS = 3000;               // কতগুলো সারি আগে থেকেই সুন্দর ফরম্যাটে রাখা হবে\nvar DASH_SHEET = \"Dashboard\";\nvar ACT_SHEET = \"User Activity\";\nvar PIX_SHEET = \"Pixel Events\";\nvar REPORT_SHEET = \"Report\";\n\n\n/* =========================================================================\n   ৪. একবার চালানোর সেটআপ (\"setupAll\" সিলেক্ট করে ▶ Run)\n   ========================================================================= */\nfunction setupAll() {\n  var ss = getSS_();\n  try { ss.setSpreadsheetTimeZone(TIMEZONE); } catch (e) {}\n  var sheet = getSheet_();\n  formatOrderSheet_(sheet);\n  getActivitySheet_(ss, true);\n  getPixelSheet_(ss, true);\n  buildReport_(ss);\n  buildDashboard_(ss);\n  try {   // ট্যাবের ক্রম: Orders, User Activity, Pixel Events, Report, Dashboard\n    [SHEET_NAME, ACT_SHEET, PIX_SHEET, REPORT_SHEET, DASH_SHEET].forEach(function (n, i) {\n      var sh = ss.getSheetByName(n); if (sh) { ss.setActiveSheet(sh); ss.moveActiveSheet(i + 1); }\n    });\n  } catch (e2) {}\n  SpreadsheetApp.flush();\n  Logger.log(\"✅ সেটআপ সম্পন্ন! Orders, User Activity, Pixel Events, Report ও Dashboard ট্যাব প্রস্তুত। এবার Deploy করুন।\");\n}\nfunction runFormatDesign() { setupAll(); }   // পুরোনো নামও কাজ করবে\n\n\n/* =========================================================================\n   ৫. GET (শুধু স্ট্যাটাস) ও POST (অর্ডার গ্রহণ)\n   ========================================================================= */\nfunction doGet() {\n  return json_({ success: true, message: \"Order API চালু আছে ✅\", time: new Date().toISOString() });\n}\n\nfunction doPost(e) {\n  var data;\n  try {\n    data = JSON.parse((e && e.postData && e.postData.contents) || \"{}\");\n  } catch (err) {\n    return json_({ success: false, error: \"রিকোয়েস্ট সঠিক নয়।\" });\n  }\n  if (data && data.action === \"track\") return handleTrack_(data);\n  return handleOrder_(data);\n}\n\n/* ---------- অর্ডার ---------- */\nfunction bnNum_(n) { return String(n).replace(/\\d/g, function (d) { return \"০১২৩৪৫৬৭৮৯\"[d]; }); }\n\nfunction fraudResponse_(phone, existing, minutes) {\n  return json_({\n    success: false, fraudAlert: true,\n    error: \"⚠️ ফ্রড এলার্ট (Fraud Alert): এই মোবাইল নাম্বার (\" + phone + \") দিয়ে কিছুক্ষণ আগেই একটি অর্ডার (\" + existing + \") গ্রহণ করা হয়েছে। আপনার অর্ডারটি প্রক্রিয়াধীন রয়েছে, বারবার অর্ডার পাঠানোর প্রয়োজন নেই। প্রয়োজনে সরাসরি আমাদের নাম্বারে কল করুন। (\" + bnNum_(minutes) + \" মিনিট পর আবার অর্ডার করা যাবে)\"\n  });\n}\n\nfunction handleOrder_(data) {\n  var cache = CacheService.getScriptCache();\n  try {\n    // ১) লক ছাড়াই যাচাই (যাতে লকের ভেতরের কাজ খুব ছোট থাকে)\n    var cfg = getLiveConfig_();\n    var validationError = validateOrder_(data, cfg);\n    if (validationError) return json_({ success: false, error: validationError });\n\n    var reqId = String(data.reqId || \"\").replace(/[^A-Za-z0-9_-]/g, \"\").slice(0, 40);\n    if (reqId) {                                       // একই অর্ডার রিট্রাই হলে আবার সেভ হবে না\n      var done = cache.get(\"req_\" + reqId);\n      if (done) return ContentService.createTextOutput(done).setMimeType(ContentService.MimeType.JSON);\n    }\n\n    var cleanPhone = normPhone_(data.phone);\n    var minutes = Math.max(1, Number(cfg.fraudMinutes) || FRAUD_PROTECTION.cooldownMinutes);\n    var fraudKey = \"honey_guard_\" + cleanPhone;\n    if (FRAUD_PROTECTION && FRAUD_PROTECTION.enabled) {\n      var existing = cache.get(fraudKey);\n      if (existing) return fraudResponse_(cleanPhone, existing, minutes);\n    }\n\n    var items = parseOrderedItems_(data, cfg);\n    if (!items.length) return json_({ success: false, error: \"অনুগ্রহ করে কমপক্ষে একটি পণ্য সিলেক্ট করুন।\" });\n\n    // দাম সবসময় সার্ভারের কনফিগ থেকে (কাস্টমার ব্রাউজার থেকে নয়)\n    var subtotal = 0, totalQty = 0, lines = [];\n    for (var i = 0; i < items.length; i++) {\n      var it = items[i], prod = cfg.products[it.id];\n      var lineTotal = prod.price * it.qty;\n      subtotal += lineTotal; totalQty += it.qty;\n      lines.push(prod.name + \" (\" + it.qty + \"টি - \" + CURRENCY + lineTotal + \")\");\n    }\n    var shipInfo = cfg.shipping[data.shippingId];\n    var shipCharge = shipInfo.charge;\n    if (cfg.freeShippingMin > 0 && subtotal >= cfg.freeShippingMin) shipCharge = 0;\n    var grand = subtotal + shipCharge;\n\n    // ২) একসাথে অনেকে অর্ডার করলে লাইনে দাঁড়িয়ে একটি একটি করে সেভ হবে\n    var lock = LockService.getScriptLock();\n    if (!lock.tryLock(25000)) {\n      return json_({ success: false, busy: true, error: \"এই মুহূর্তে অনেকে অর্ডার করছেন। কয়েক সেকেন্ড অপেক্ষা করুন, নিজে থেকেই আবার চেষ্টা হবে।\" });\n    }\n    try {\n      if (reqId) {\n        var done2 = cache.get(\"req_\" + reqId);\n        if (done2) return ContentService.createTextOutput(done2).setMimeType(ContentService.MimeType.JSON);\n      }\n      if (FRAUD_PROTECTION && FRAUD_PROTECTION.enabled) {\n        var existing2 = cache.get(fraudKey);\n        if (existing2) return fraudResponse_(cleanPhone, existing2, minutes);\n      }\n\n      var sheet = getSheet_();\n      var orderId = nextOrderId_();\n      var row = sheet.getLastRow() + 1;\n      ensureCapacity_(sheet, row);\n\n      var rowValues = [\n        orderId, new Date(), clean_(data.name, 100), cleanPhone, clean_(data.district, 80), clean_(data.address, 350),\n        lines.join(\",\\n\"), totalQty, subtotal, shipInfo.label, shipCharge, grand,\n        clean_(data.note || \"কোনো নোট নেই\", 300), \"New\", clean_(data.source || \"direct\", 80)\n      ];\n      sheet.getRange(row, 4).setNumberFormat(\"@\");                     // ফোনের শুরুর ০ যেন না কাটে\n      sheet.getRange(row, 1, 1, HEADERS.length).setValues([rowValues]);\n\n      var result = { success: true, orderId: orderId, subtotal: subtotal, deliveryCharge: shipCharge, total: grand, itemsCount: totalQty, message: \"আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!\" };\n      try { cache.put(fraudKey, orderId, Math.max(60, minutes * 60)); } catch (c1) {}\n      if (reqId) { try { cache.put(\"req_\" + reqId, JSON.stringify(result), 600); } catch (c2) {} }\n      return json_(result);\n    } finally {\n      try { lock.releaseLock(); } catch (x) {}\n    }\n  } catch (err) {\n    return json_({ success: false, error: \"সার্ভারে সাময়িক সমস্যা হয়েছে: \" + err.message });\n  }\n}\n\n\n/* =========================================================================\n   ভিজিটর অ্যাক্টিভিটি ও Pixel ইভেন্ট সংরক্ষণ (অর্ডারের লকের সাথে সম্পর্কহীন – অর্ডার ধীর হয় না)\n   ========================================================================= */\nvar PIXEL_EVENTS = { PageView: 1, ViewContent: 1, AddToCart: 1, InitiateCheckout: 1, Purchase: 1 };\n\nfunction yn_(v) { return v ? \"Yes\" : \"No\"; }\nfunction num_(v, max) { var n = Number(v); return isNaN(n) ? 0 : Math.max(0, Math.min(max || 1e9, Math.round(n))); }\n\nfunction handleTrack_(d) {\n  var sid = String(d.sid || \"\").replace(/[^A-Za-z0-9_-]/g, \"\").slice(0, 40);\n  var a = d.a;\n  if (!sid || !a || typeof a !== \"object\") return json_({ success: true, skipped: true });\n\n  var cache = CacheService.getScriptCache();\n  var mk = \"trk_\" + Utilities.formatDate(new Date(), TIMEZONE, \"yyMMddHHmm\");\n  var n = parseInt(cache.get(mk) || \"0\", 10);\n  if (n >= TRACK_LIMIT_PER_MIN) return json_({ success: true, skipped: true });\n  try { cache.put(mk, String(n + 1), 90); } catch (e0) {}\n\n  var lock = LockService.getDocumentLock();            // অর্ডারের (Script) লক থেকে আলাদা\n  if (!lock.tryLock(4000)) return json_({ success: true, skipped: true });\n  try {\n    var ss = getSS_(), now = new Date();\n    var act = getActivitySheet_(ss, false);\n    var evNames = [];\n    var evs = Array.isArray(d.ev) ? d.ev.slice(0, 20) : [];\n    for (var k = 0; k < evs.length; k++) if (evs[k] && PIXEL_EVENTS[evs[k].n]) evNames.push(evs[k].n);\n\n    var cached = cache.get(\"act_\" + sid);\n    var vals = [\n      now, sid, clean_(a.src || \"direct\", 80), clean_(a.med, 60), clean_(a.camp, 80), clean_(a.ref, 80), clean_(a.dev, 20), clean_(a.scr, 20),\n      clean_(a.land || \"/\", 80), num_(a.scroll, 100), num_(a.secs, 86400), num_(a.cta, 999), yn_(a.vs), yn_(a.chk), yn_(a.form), yn_(a.ord), clean_(a.oid, 40),\n      \"\", now\n    ];\n    var row = cached ? parseInt(cached.split(\"|\")[0], 10) : 0;\n    var seen = cached ? cached.split(\"|\").slice(1).join(\"|\") : \"\";\n    if (row > 1 && String(act.getRange(row, 2).getValue()) === sid) {\n      var merged = (seen ? seen.split(\",\") : []).concat(evNames);\n      vals[17] = merged.join(\",\");\n      act.getRange(row, 2, 1, vals.length - 1).setValues([vals.slice(1)]);\n      try { cache.put(\"act_\" + sid, row + \"|\" + vals[17], 21600); } catch (e1) {}\n    } else {\n      row = act.getLastRow() + 1;\n      ensureRows_(act, row, function (start, cnt) { fmtActivity_(act, start, cnt); });\n      vals[17] = evNames.join(\",\");\n      act.getRange(row, 1, 1, vals.length).setValues([vals]);\n      try { cache.put(\"act_\" + sid, row + \"|\" + vals[17], 21600); } catch (e2) {}\n    }\n\n    var out = [];\n    for (var m = 0; m < evs.length; m++) {\n      var ev = evs[m];\n      if (!ev || !PIXEL_EVENTS[ev.n]) continue;\n      out.push([now, sid, ev.n, num_(ev.v, 1e8), \"BDT\", clean_(ev.c, 80), clean_(ev.o, 40), clean_(a.src || \"direct\", 80), clean_(a.dev, 20)]);\n    }\n    if (out.length) {\n      var pix = getPixelSheet_(ss, false), pr = pix.getLastRow() + 1;\n      ensureRows_(pix, pr + out.length, function (start, cnt) { fmtPixel_(pix, start, cnt); });\n      pix.getRange(pr, 1, out.length, 9).setValues(out);\n    }\n    return json_({ success: true });\n  } catch (err) {\n    return json_({ success: false, error: \"tracking: \" + err.message });\n  } finally {\n    try { lock.releaseLock(); } catch (x) {}\n  }\n}\n\n\n/* =========================================================================\n   ৬. দাম ও ডেলিভারি যাচাই (ওয়েবসাইটের js/config.js থেকে – এক জায়গা থেকেই সব)\n   ========================================================================= */\nfunction defaultLiveConfig_() {\n  var products = {}, shipping = {}, k;\n  for (k in PRODUCTS_CONFIG) products[k] = { name: PRODUCTS_CONFIG[k].name, price: PRODUCTS_CONFIG[k].price, active: true };\n  for (k in SHIPPING_CONFIG) shipping[k] = { label: SHIPPING_CONFIG[k].label, charge: SHIPPING_CONFIG[k].charge };\n  return { products: products, shipping: shipping, freeShippingMin: FREE_SHIPPING_MIN_TOTAL, maxQty: MAX_QTY_PER_ITEM, fraudMinutes: FRAUD_PROTECTION.cooldownMinutes };\n}\n\nfunction getLiveConfig_() {\n  var url = String(SITE_URL || \"\").replace(/\\/+$/, \"\");\n  if (!url) return defaultLiveConfig_();\n\n  var cache = CacheService.getScriptCache();\n  var hit = cache.get(\"live_cfg\");\n  if (hit) { try { return JSON.parse(hit); } catch (e) {} }\n\n  try {\n    var res = UrlFetchApp.fetch(url + \"/js/config.js?t=\" + new Date().getTime(), { muteHttpExceptions: true });\n    if (res.getResponseCode() !== 200) throw new Error(\"config.js পাওয়া যায়নি (\" + res.getResponseCode() + \")\");\n    var txt = res.getContentText();\n    var c = JSON.parse(txt.substring(txt.indexOf(\"{\"), txt.lastIndexOf(\"}\") + 1));\n\n    var out = defaultLiveConfig_();\n    if (c.products && c.products.length) {\n      out.products = {};\n      for (var i = 0; i < c.products.length; i++) {\n        var p = c.products[i];\n        if (!p || !p.id) continue;\n        out.products[p.id] = { name: String(p.name || p.id), price: Number(p.price) || 0, active: p.active !== false };\n      }\n    }\n    if (c.shipping && c.shipping.length) {\n      out.shipping = {};\n      for (var j = 0; j < c.shipping.length; j++) {\n        var sh = c.shipping[j];\n        if (!sh || !sh.id) continue;\n        out.shipping[sh.id] = { label: String(sh.label || sh.id), charge: Number(sh.charge) || 0 };\n      }\n    }\n    if (c.freeShippingMinTotal !== undefined) out.freeShippingMin = Number(c.freeShippingMinTotal) || 0;\n    if (c.maxQty !== undefined) out.maxQty = Number(c.maxQty) || MAX_QTY_PER_ITEM;\n    if (c.fraudMinutes !== undefined) out.fraudMinutes = Number(c.fraudMinutes) || FRAUD_PROTECTION.cooldownMinutes;\n    try { cache.put(\"live_cfg\", JSON.stringify(out), 60); } catch (e2) {}\n    return out;\n  } catch (err) {\n    return defaultLiveConfig_();       // ওয়েবসাইট না পেলে ডিফল্ট দাম\n  }\n}\n\n\n/* =========================================================================\n   ৭. অর্ডার সংক্রান্ত ফাংশন\n   ========================================================================= */\nfunction parseOrderedItems_(d, cfg) {\n  var items = [];\n  if (Array.isArray(d.items)) {\n    for (var i = 0; i < d.items.length; i++) {\n      var it = d.items[i];\n      if (it && it.id && cfg.products[it.id] && cfg.products[it.id].active) {\n        var q = parseInt(it.qty, 10);\n        if (!isNaN(q) && q > 0) items.push({ id: it.id, qty: Math.min(q, cfg.maxQty) });\n      }\n    }\n  }\n  return items;\n}\n\nfunction validateOrder_(d, cfg) {\n  if (!d || typeof d !== \"object\") return \"অর্ডার রিকোয়েস্ট সঠিক নয়।\";\n  if (!d.name || String(d.name).trim().length < 2) return \"অনুগ্রহ করে আপনার সঠিক নাম লিখুন।\";\n  if (!/^01[3-9]\\d{8}$/.test(normPhone_(d.phone))) return \"১১ ডিজিটের সঠিক মোবাইল নাম্বার দিন (যেমন: 01712345678)।\";\n  if (!d.district || String(d.district).trim().length < 2) return \"আপনার জেলা বা এলাকার নাম দিন।\";\n  if (!d.address || String(d.address).trim().length < 6) return \"সম্পূর্ণ বিস্তারিত ঠিকানা লিখুন।\";\n  if (!cfg.shipping[d.shippingId]) return \"ডেলিভারি এলাকা নির্বাচন সঠিক নয়।\";\n  return null;\n}\n\nfunction normPhone_(v) {\n  var s = String(v || \"\").replace(/[\\s\\-()]/g, \"\");\n  s = s.replace(/[০-৯]/g, function (c) { return \"০১২৩৪৫৬৭৮৯\".indexOf(c); });\n  return s.replace(/^\\+?88/, \"\");\n}\n\nfunction clean_(v, maxLen) {\n  var s = String(v == null ? \"\" : v).replace(/[\\u0000-\\u001f]+/g, \" \").trim();\n  if (maxLen && s.length > maxLen) s = s.substring(0, maxLen);\n  return /^[=+\\-@]/.test(s) ? \"'\" + s : s;       // শিট ফর্মুলা ইনজেকশন প্রতিরোধ\n}\n\nfunction nextOrderId_() {\n  var day = Utilities.formatDate(new Date(), TIMEZONE, \"yyMMdd\");\n  var props = PropertiesService.getScriptProperties();\n  var key = \"seq_\" + day;\n  var n = parseInt(props.getProperty(key) || \"0\", 10) + 1;\n  props.setProperty(key, String(n));\n  return \"HN-\" + day + \"-\" + (\"000\" + n).slice(-4);\n}\n\n\n/* =========================================================================\n   ৮. গুগল শিট কানেকশন ও সুন্দর ফরম্যাটিং\n   ========================================================================= */\nfunction getSS_() {\n  var rawId = String(SPREADSHEET_ID || \"\").trim(), ss;\n  if (rawId) {\n    var m = rawId.match(/\\/d\\/([a-zA-Z0-9-_]+)/);\n    try { ss = SpreadsheetApp.openById(m ? m[1] : rawId); }\n    catch (e) { throw new Error(\"SPREADSHEET_ID ভুল বা অনুমতি নেই। (\" + e.message + \")\"); }\n  } else {\n    ss = SpreadsheetApp.getActiveSpreadsheet();\n  }\n  if (!ss) throw new Error(\"গুগল শিট পাওয়া যায়নি। SPREADSHEET_ID দিন।\");\n  return ss;\n}\n\nfunction getSheet_() {\n  var ss = getSS_();\n  var sheet = ss.getSheetByName(SHEET_NAME);\n  if (!sheet) {\n    var all = ss.getSheets();\n    if (all.length && all[0].getLastRow() <= 1 && all[0].getName() !== DASH_SHEET) {\n      all[0].setName(SHEET_NAME);\n      sheet = all[0];\n    }\n  }\n  if (!sheet) sheet = ss.insertSheet(SHEET_NAME);\n\n  if (sheet.getLastRow() === 0 || String(sheet.getRange(1, 1).getValue()) !== HEADERS[0]) {\n    if (sheet.getLastRow() === 0) {\n      sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]);\n      formatOrderSheet_(sheet);\n      try { buildDashboard_(ss); } catch (e) {}\n    } else {\n      sheet.getRange(1, 1, 1, HEADERS.length).setValues([HEADERS]);\n    }\n  }\n  return sheet;\n}\n\nfunction ensureCapacity_(sheet, row) {\n  var max = sheet.getMaxRows();\n  if (row > max - 5) {\n    sheet.insertRowsAfter(max, 1000);\n    applyColumnFormats_(sheet, max + 1, 1000);\n  }\n}\n\nfunction applyColumnFormats_(sheet, startRow, numRows) {\n  var n = HEADERS.length;\n  function col(c) { return sheet.getRange(startRow, c, numRows, 1); }\n  sheet.getRange(startRow, 1, numRows, n).setFontFamily(\"Segoe UI\").setFontSize(10).setVerticalAlignment(\"middle\");\n  col(1).setHorizontalAlignment(\"center\").setFontWeight(\"bold\").setFontColor(\"#1E293B\");\n  col(2).setHorizontalAlignment(\"center\").setNumberFormat(\"dd-mmm-yyyy hh:mm AM/PM\");\n  col(3).setHorizontalAlignment(\"left\").setFontWeight(\"bold\").setFontColor(\"#0F172A\");\n  col(4).setHorizontalAlignment(\"center\").setNumberFormat(\"@\");\n  col(5).setHorizontalAlignment(\"center\");\n  col(6).setHorizontalAlignment(\"left\").setWrap(true);\n  col(7).setHorizontalAlignment(\"left\").setWrap(true);\n  col(8).setHorizontalAlignment(\"center\").setFontWeight(\"bold\");\n  col(9).setHorizontalAlignment(\"right\").setNumberFormat('\"৳\"#,##0');\n  col(10).setHorizontalAlignment(\"center\");\n  col(11).setHorizontalAlignment(\"right\").setNumberFormat('\"৳\"#,##0');\n  col(12).setHorizontalAlignment(\"right\").setFontWeight(\"bold\").setFontColor(\"#0F5132\").setBackground(\"#E6F4EA\").setNumberFormat('\"৳\"#,##0');\n  col(13).setHorizontalAlignment(\"left\").setWrap(true);\n  col(15).setHorizontalAlignment(\"left\");\n  col(14).setHorizontalAlignment(\"center\").setFontWeight(\"bold\")\n    .setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(STATUSES, true).setAllowInvalid(false).build());\n}\n\nfunction formatOrderSheet_(sheet) {\n  var n = HEADERS.length;\n  var maxRows = sheet.getMaxRows();\n  if (maxRows < FORMAT_ROWS) sheet.insertRowsAfter(maxRows, FORMAT_ROWS - maxRows);\n  var total = sheet.getMaxRows();\n\n  for (var c = 0; c < COL_WIDTHS.length; c++) sheet.setColumnWidth(c + 1, COL_WIDTHS[c]);\n\n  // হেডার\n  sheet.setFrozenRows(1);\n  sheet.setFrozenColumns(1);\n  sheet.setRowHeight(1, 42);\n  sheet.getRange(1, 1, 1, n).setValues([HEADERS])\n    .setFontWeight(\"bold\").setFontSize(11).setFontFamily(\"Segoe UI\")\n    .setBackground(\"#0F5132\").setFontColor(\"#FFFFFF\")\n    .setHorizontalAlignment(\"center\").setVerticalAlignment(\"middle\").setWrap(true);\n\n  // ডাটা সারির কলাম ফরম্যাট (একবারেই – অর্ডার সাবমিট তাই দ্রুত হয়)\n  applyColumnFormats_(sheet, 2, total - 1);\n  sheet.getRange(2, 1, total - 1, n).setBorder(true, true, true, true, true, true, \"#CBD5E1\", SpreadsheetApp.BorderStyle.SOLID);\n\n  // জেব্রা স্ট্রাইপ (ব্যান্ডিং) – নতুন সারিতেও নিজে থেকে প্রযোজ্য\n  try {\n    var banded = sheet.getBandings();\n    for (var b = 0; b < banded.length; b++) banded[b].remove();\n    sheet.getRange(2, 1, total - 1, n).applyRowBanding(SpreadsheetApp.BandingTheme.LIGHT_GREY, false, false)\n      .setFirstRowColor(\"#FFFFFF\").setSecondRowColor(\"#F8FAFC\");\n  } catch (e) {}\n\n  // ফিল্টার\n  try {\n    var f = sheet.getFilter();\n    if (f) f.remove();\n    sheet.getRange(1, 1, total, n).createFilter();\n  } catch (e2) {}\n\n  // স্ট্যাটাস কালার\n  var range = sheet.getRange(2, STATUS_COL, total - 1, 1);\n  var defs = [[\"New\", \"#FEF3C7\", \"#92400E\"], [\"Processing\", \"#DBEAFE\", \"#1E40AF\"], [\"Delivered\", \"#D1FAE5\", \"#065F46\"], [\"Cancelled\", \"#FEE2E2\", \"#991B1B\"]];\n  var rules = [];\n  for (var i = 0; i < defs.length; i++) {\n    rules.push(SpreadsheetApp.newConditionalFormatRule().whenTextEqualTo(defs[i][0]).setBackground(defs[i][1]).setFontColor(defs[i][2]).setRanges([range]).build());\n  }\n  sheet.setConditionalFormatRules(rules);\n\n  // ট্যাব রঙ\n  try { sheet.setTabColor(\"#0F5132\"); } catch (e3) {}\n}\n\n\n/* =========================================================================\n   ৮খ. User Activity, Pixel Events ও Report ট্যাব\n   ========================================================================= */\nvar ACT_HEADERS = [\"Date & Time\", \"Session ID\", \"Source\", \"Medium\", \"Campaign\", \"Referrer\", \"Device\", \"Screen\", \"Landing Page\",\n  \"Max Scroll %\", \"Time on Page (sec)\", \"Order Btn Clicks\", \"Video Sound On\", \"Reached Checkout\", \"Started Form\", \"Ordered\", \"Order ID\", \"Pixel Events\", \"Last Update\"];\nvar ACT_WIDTHS = [165, 150, 120, 100, 130, 130, 90, 90, 110, 100, 120, 110, 110, 120, 105, 90, 140, 260, 165];\nvar PIX_HEADERS = [\"Date & Time\", \"Session ID\", \"Event\", \"Value\", \"Currency\", \"Content IDs\", \"Order ID\", \"Source\", \"Device\"];\nvar PIX_WIDTHS = [165, 150, 140, 100, 80, 160, 140, 130, 90];\n\nfunction ensureRows_(sheet, row, fmt) {\n  var max = sheet.getMaxRows();\n  if (row > max - 5) {\n    sheet.insertRowsAfter(max, 1500);\n    if (fmt) fmt(max + 1, 1500);\n  }\n}\n\nfunction styleHeader_(sh, headers, widths, color) {\n  for (var c = 0; c < widths.length; c++) sh.setColumnWidth(c + 1, widths[c]);\n  sh.setFrozenRows(1);\n  sh.setRowHeight(1, 40);\n  sh.getRange(1, 1, 1, headers.length).setValues([headers])\n    .setFontWeight(\"bold\").setFontSize(11).setFontFamily(\"Segoe UI\")\n    .setBackground(color).setFontColor(\"#FFFFFF\")\n    .setHorizontalAlignment(\"center\").setVerticalAlignment(\"middle\").setWrap(true);\n  try { sh.setTabColor(color); } catch (e) {}\n}\n\nfunction fmtActivity_(sh, start, count) {\n  sh.getRange(start, 1, count, ACT_HEADERS.length).setFontFamily(\"Segoe UI\").setFontSize(10).setVerticalAlignment(\"middle\").setHorizontalAlignment(\"center\");\n  sh.getRange(start, 1, count, 1).setNumberFormat(\"dd-mmm-yyyy hh:mm AM/PM\");\n  sh.getRange(start, 19, count, 1).setNumberFormat(\"dd-mmm-yyyy hh:mm AM/PM\");\n  sh.getRange(start, 10, count, 1).setNumberFormat('0\"%\"');\n  sh.getRange(start, 11, count, 1).setNumberFormat(\"0\");\n  sh.getRange(start, 9, count, 1).setHorizontalAlignment(\"left\");\n  sh.getRange(start, 18, count, 1).setHorizontalAlignment(\"left\");\n}\nfunction getActivitySheet_(ss, force) {\n  ss = ss || getSS_();\n  var sh = ss.getSheetByName(ACT_SHEET), fresh = false;\n  if (!sh) { sh = ss.insertShee     // শুধু যেসব নতুন ছবি এখনো কনফিগে ব্যবহৃত হচ্ছে সেগুলোই জিপে যাবে
    var used = JSON.stringify(payload());
    paths = paths.filter(function (p) { return used.indexOf(p) > -1; });
    if (!paths.length) {
      download("config.js", text, "text/javascript");
      toast("config.js নামানো হয়েছে → প্রজেক্টের js/ ফোল্ডারে রিপ্লেস করুন", "ok");
    } else {
      Promise.all(paths.map(function (p) { return pending[p].blob.arrayBuffer().then(function (b) { return { name: p, data: new Uint8Array(b) }; }); })).then(function (files) {
        files.unshift({ name: "js/config.js", data: enc.encode(text) });
        download("site-update.zip", makeZip(files), "application/zip");
        toast("site-update.zip নামানো হয়েছে → Extract করে প্রজেক্টে মার্জ করুন", "ok");
      });
    }
    exported = true; status();
    try { localStorage.setItem(DK, JSON.stringify({ base: baseSig, data: payload() })); } catch (e) {}
  }

  /* ---------- লগইন / লগআউট ---------- */
  function fixCfg() {
    cfg.contact = cfg.contact || {}; cfg.sections = cfg.sections || {}; cfg.copy = cfg.copy || {}; cfg.theme = cfg.theme || {};
    cfg.custom = cfg.custom || []; cfg.tracking = cfg.tracking || { fbPixelId: "", activity: true, sample: 100 };
    cfg.products.forEach(function (p) { if (p.active === undefined) p.active = true; if (p.oldPrice == null || p.oldPrice === 0) p.oldPrice = p.oldPrice || ""; if (p.badge == null) p.badge = ""; });
    cfg.custom.forEach(function (c) { c.images = c.images || []; c.cards = c.cards || []; });
    normOrder();
  }
  function showLogin(msg) {
    $("#appView").hidden = true; $("#loginView").hidden = false;
    var e = $("#loginErr"); e.hidden = !msg; e.textContent = msg || "";
  }
  function start() {
    $("#loginView").hidden = true; $("#appView").hidden = false;
    var draft = null;
    try { var d = JSON.parse(localStorage.getItem(DK) || "null"); if (d && d.base === baseSig) draft = d.data; else localStorage.removeItem(DK); } catch (e) {}
    cfg = merge(clone(DEF), draft || {});
    fixCfg();
    if (draft) { isDirty = true; toast("আগের অসংরক্ষিত ড্রাফট ফিরিয়ে আনা হয়েছে", "ok"); }
    status(); render();
  }
  function doLogout() {
    if (((isDirty || Object.keys(pending).length) && !exported) && !confirm("ডাউনলোড করা হয়নি এমন পরিবর্তন আছে (ড্রাফট সেভ থাকবে, তবে নতুন ছবি হারাবে)। লগআউট করবেন?")) return;
    try { sessionStorage.removeItem("hn_adm_ok"); } catch (e) {}
    isDirty = false; pending = {}; closeMenu(); showLogin("");
  }
  $("#loginForm").onsubmit = function (e) {
    e.preventDefault();
    var pw = $("#pw").value;
    setTimeout(function () {
      if (sha256("hn-admin:" + pw) === PW_HASH) {
        try { sessionStorage.setItem("hn_adm_ok", "1"); } catch (x) {}
        $("#pw").value = ""; start();
      } else { showLogin("পাসওয়ার্ড ভুল হয়েছে।"); }
    }, 350);
  };
  $("#saveBtn").onclick = save;
  $("#menuBtn").onclick = function () { $("#side").classList.add("open"); $("#scrim").classList.add("show"); };
  $("#scrim").onclick = closeMenu;
  $("#previewBtn").onclick = function () {
    try { localStorage.setItem(DK, JSON.stringify({ base: baseSig, data: payload() })); } catch (e) {}
    if (window.innerWidth >= 1000) {
      var on = $("#pv").hidden;
      $("#pv").hidden = !on;
      if (on) $("#pvFrame").src = "index.html?preview=1";
    } else window.open("index.html?preview=1", "_blank");
  };
  $("#pvClose").onclick = function () { $("#pv").hidden = true; };
  document.addEventListener("keydown", function (e) { if ((e.ctrlKey || e.metaKey) && e.key === "s" && cfg) { e.preventDefault(); save(); } });

  var ok = false; try { ok = sessionStorage.getItem("hn_adm_ok") === "1"; } catch (e) {}
  if (ok) start();
})();

</script>
</body>
</html>
